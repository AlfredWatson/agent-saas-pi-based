services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hpc_ai_tech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DATABASE:-pi_saas}
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
volumes:
  postgres-data:
