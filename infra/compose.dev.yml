services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hpc_ai_tech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DATABASE:-pi_saas}
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_USERNAME: ${REDIS_USERNAME:-admin}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports: ["6379:6379"]
    volumes:
      - ../docker/volumes/redis:/data
      - ../docker/redis/entrypoint.sh:/usr/local/bin/pi-redis-entrypoint:ro
    entrypoint: ["/usr/local/bin/pi-redis-entrypoint"]
    restart: unless-stopped
volumes:
  postgres-data:
