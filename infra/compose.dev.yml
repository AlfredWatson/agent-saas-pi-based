services:
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_USERNAME: ${REDIS_USERNAME:-admin}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports: ["6379:6379"]
    volumes:
      - ../docker/volumes/redis:/data
      - ../docker/redis/entrypoint.sh:/usr/local/bin/pi-redis-entrypoint:ro
    entrypoint: ["/usr/local/bin/pi-redis-entrypoint"]
    restart: unless-stopped
