[project]
name = "pi-saas-platform"
version = "0.1.0"
description = "Multi-tenant gateway for pi-coding-agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "pydantic-settings>=2.4,<3",
    "pydantic[email]>=2.4,<3",
    "PyJWT>=2.9,<3",
    "argon2-cffi>=23.1,<24",
    "cryptography>=43,<46",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1",
    "socksio>=1.0.0",
    "docker>=7.1,<8",
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-anthropic>=1.0,<2",
    "langchain-text-splitters>=1.0,<2",
    "langsmith>=0.3,<1",
    "redis>=6,<7",
    "pgvector>=0.4,<1",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "openpyxl>=3.1,<4",
    "python-pptx>=1.0,<2",
    "rank-bm25>=0.2,<1",
    "jieba>=0.42,<1",
    "tiktoken>=0.11,<1",
    "pymilvus==3.0.1",
    "chromadb==1.5.9",
    "qdrant-client==1.19.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "huggingface-hub>=1.32.0",
    "pyarrow>=25.0.1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "tokenizers>=0.23.2",
]
